<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeatLock — Movie & Event Booking</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0e; --bg-1:#111117; --bg-2:#191922; --bg-3:#22222d;
  --line:#2a2a36; --line-soft:#1c1c26;
  --text:#f4f4f6; --muted:#93939f; --muted-2:#5f5f6b;
  --accent:#ff4d5e; --accent-2:#ff7a45; --gold:#ffbe3d;
  --held:#e0972d; --booked:#4b4b57; --ok:#22c55e;
  --radius:14px; --radius-lg:22px;
  --font-display:'Bebas Neue', 'Inter', sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
a{color:inherit}
button,select,input{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid rgba(255,77,94,.65);outline-offset:3px}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;transition:background .2s}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}

/* ---------- layout shells ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header.site{position:sticky;top:0;z-index:40;background:rgba(10,10,14,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.055);box-shadow:0 8px 30px rgba(0,0,0,.14)}
.site-bar{display:flex;align-items:center;gap:18px;padding:14px 0}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;border:0;background:none;color:inherit;padding:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 6px 18px -6px rgba(255,77,94,.6)}
.brand .name{font-family:var(--font-display);font-size:26px;letter-spacing:.5px;line-height:1}
.brand .name b{color:var(--accent);font-weight:400}
.city-picker{position:relative;z-index:60}
.city-trigger{display:flex;align-items:center;gap:8px;min-width:145px;background:linear-gradient(180deg,#1c1c25,#15151d);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:9px 12px 9px 13px;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:background .22s ease,border-color .22s ease,box-shadow .22s ease,transform .16s ease}
.city-trigger:hover{background:linear-gradient(180deg,#22222c,#191921);border-color:rgba(255,255,255,.18);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.city-trigger:active{transform:scale(.98)}
.city-trigger[aria-expanded="true"]{border-color:rgba(255,77,94,.55);box-shadow:0 0 0 4px rgba(255,77,94,.08),0 12px 28px rgba(0,0,0,.24)}
.city-pin{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(255,77,94,.12);color:var(--accent);font-size:14px}
.city-current{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.city-chevron{margin-left:auto;color:var(--muted);font-size:16px;line-height:1;transform:translateY(-1px);transition:transform .22s ease,color .22s ease}
.city-trigger[aria-expanded="true"] .city-chevron{transform:rotate(180deg);color:var(--text)}
.city-menu{position:absolute;top:calc(100% + 9px);left:0;min-width:190px;padding:7px;background:rgba(25,25,34,.97);border:1px solid rgba(255,255,255,.1);border-radius:15px;box-shadow:0 18px 45px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.2);backdrop-filter:blur(18px);opacity:0;visibility:hidden;transform:translateY(-7px) scale(.98);transform-origin:top center;transition:opacity .18s ease,transform .2s cubic-bezier(.2,.75,.25,1),visibility .18s ease}
.city-menu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.city-option{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--muted);padding:10px 11px;border-radius:10px;text-align:left;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .16s ease,color .16s ease,transform .16s ease}
.city-option:hover{background:rgba(255,255,255,.07);color:var(--text);transform:translateX(2px)}
.city-option.active{background:rgba(255,77,94,.11);color:#fff}
.city-option .check{margin-left:auto;color:var(--accent);opacity:0;transition:opacity .16s ease}
.city-option.active .check{opacity:1}
.search-box{flex:1;max-width:420px;position:relative}
.search-box input{width:100%;background:linear-gradient(180deg,var(--bg-2),#15151d);border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:10px 16px 10px 38px;color:var(--text);font:inherit;font-size:14px;outline:none;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
.search-box input:hover{border-color:rgba(255,255,255,.13)}
.search-box input:focus{border-color:rgba(255,77,94,.65);box-shadow:0 0 0 4px rgba(255,77,94,.08);background:var(--bg-2)}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;transition:opacity .2s}
.search-box:focus-within svg{opacity:.8}
.search-box input::placeholder{color:#6f6f7c}
.search-box input{transition:border-color .2s ease,box-shadow .2s ease,background .2s ease,transform .2s ease}
.search-box input:focus{transform:translateY(-1px)}
.show-pill{transition:transform .2s cubic-bezier(.2,.75,.25,1),background .2s ease,border-color .2s ease,box-shadow .2s ease!important}
.show-pill:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,0,0,.2)}
.method{transition:transform .2s cubic-bezier(.2,.75,.25,1),border-color .2s ease,background .2s ease,box-shadow .2s ease!important}
.method.active{box-shadow:0 8px 22px rgba(255,77,94,.12),inset 0 0 0 1px rgba(255,77,94,.12)}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links button{background:none;border:1px solid transparent;color:var(--muted);font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer;transition:color .2s ease,background .2s ease,border-color .2s ease,transform .16s ease}
.nav-links button:active{transform:scale(.97)}
.nav-links button:hover{color:var(--text);background:var(--bg-2)}
.nav-links button.active{color:var(--text);background:var(--bg-3);border-color:rgba(255,255,255,.045);box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.guest-pill{font-size:12px;color:var(--muted-2);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}

main{min-height:70vh}
.view{animation:viewIn .32s cubic-bezier(.2,.7,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ---------- home / hero ---------- */
.hero{padding:46px 0 30px;position:relative;overflow:hidden}
.hero h1{font-family:var(--font-display);font-size:clamp(38px,6vw,64px);line-height:.95;margin:0 0 10px;letter-spacing:.3px}
.hero p{color:var(--muted);font-size:16px;max-width:520px;margin:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 16px}
.section-head h2{font-family:var(--font-display);font-size:26px;letter-spacing:.4px;margin:0}
.section-head span{color:var(--muted-2);font-size:13px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line);background:var(--bg-2);color:var(--muted);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:color .2s ease,border-color .2s ease,background .2s ease,transform .16s ease,box-shadow .2s ease}
.chip:hover{border-color:var(--muted-2);color:var(--text);transform:translateY(-1px)}
.chip:active{transform:scale(.97)}
.chip.active{background:var(--text);color:#0a0a0e;border-color:var(--text)}

.movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding-bottom:12px}
.movie-card{border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-1);border:1px solid var(--line-soft);cursor:pointer;transition:transform .28s cubic-bezier(.2,.75,.25,1),border-color .22s ease,box-shadow .28s ease;position:relative}
.movie-card:active{transform:scale(.985)}
