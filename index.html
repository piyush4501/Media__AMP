<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeatLock — Movie & Event Booking</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0e; --bg-1:#111117; --bg-2:#191922; --bg-3:#22222d;
  --line:#2a2a36; --line-soft:#1c1c26;
  --text:#f4f4f6; --muted:#93939f; --muted-2:#5f5f6b;
  --accent:#ff4d5e; --accent-2:#ff7a45; --gold:#ffbe3d;
  --held:#e0972d; --booked:#4b4b57; --ok:#22c55e;
  --radius:14px; --radius-lg:22px;
  --font-display:'Bebas Neue', 'Inter', sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
a{color:inherit}
button{font-family:inherit}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- layout shells ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header.site{position:sticky;top:0;z-index:40;background:rgba(10,10,14,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.site-bar{display:flex;align-items:center;gap:18px;padding:14px 0}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;border:0;background:none;color:inherit;padding:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 6px 18px -6px rgba(255,77,94,.6)}
.brand .name{font-family:var(--font-display);font-size:26px;letter-spacing:.5px;line-height:1}
.brand .name b{color:var(--accent);font-weight:400}
.city-pick{display:flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.city-pick select{background:none;border:0;color:var(--text);font:inherit;font-weight:600;cursor:pointer;outline:none}
.city-pick select option{background:var(--bg-2)}
.search-box{flex:1;max-width:420px;position:relative}
.search-box input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:10px 16px 10px 38px;color:var(--text);font:inherit;font-size:14px;outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links button{background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.15s}
.nav-links button:hover{color:var(--text);background:var(--bg-2)}
.nav-links button.active{color:var(--text);background:var(--bg-3)}
.guest-pill{font-size:12px;color:var(--muted-2);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}

main{min-height:70vh}
.view{animation:viewIn .32s cubic-bezier(.2,.7,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ---------- home / hero ---------- */
.hero{padding:46px 0 30px;position:relative;overflow:hidden}
.hero h1{font-family:var(--font-display);font-size:clamp(38px,6vw,64px);line-height:.95;margin:0 0 10px;letter-spacing:.3px}
.hero p{color:var(--muted);font-size:16px;max-width:520px;margin:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 16px}
.section-head h2{font-family:var(--font-display);font-size:26px;letter-spacing:.4px;margin:0}
.section-head span{color:var(--muted-2);font-size:13px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line);background:var(--bg-2);color:var(--muted);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--muted-2);color:var(--text)}
.chip.active{background:var(--text);color:#0a0a0e;border-color:var(--text)}

.movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding-bottom:12px}
.movie-card{border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-1);border:1px solid var(--line-soft);cursor:pointer;transition:transform .2s ease, border-color .2s;position:relative}
.movie-card:hover{transform:translateY(-5px);border-color:var(--line)}
.poster{height:270px;position:relative;display:flex;align-items:flex-end;padding:16px;color:#fff;overflow:hidden}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.75) 100%)}
.poster .ptitle{position:relative;z-index:1;font-family:var(--font-display);font-size:26px;line-height:1;letter-spacing:.3px;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.poster .format-tag{position:absolute;top:12px;right:12px;z-index:1;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25);font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.rating-badge{position:absolute;top:12px;left:12px;z-index:1;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;display:flex;align-items:center;gap:4px}
.movie-meta{padding:13px 15px 16px;font-size:12.5px;color:var(--muted)}
.movie-meta .mg{color:var(--text);font-weight:600;display:block;margin-bottom:4px;font-size:13.5px}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .big{font-size:44px;margin-bottom:10px}

/* skeletons */
.skel{background:linear-gradient(100deg,var(--bg-1) 30%,var(--bg-2) 50%,var(--bg-1) 70%);background-size:200% 100%;animation:shine 1.3s infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
.skel-card{height:270px;border-radius:var(--radius-lg)}

/* ---------- movie detail ---------- */
.detail-banner{border-radius:var(--radius-lg);padding:34px;margin-top:22px;position:relative;overflow:hidden;color:#fff}
.detail-banner::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.18),transparent 55%)}
.detail-banner .content{position:relative;z-index:1}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:18px}
.detail-banner h1{font-family:var(--font-display);font-size:clamp(34px,5vw,52px);margin:0 0 8px;letter-spacing:.3px}
.meta-line{display:flex;gap:10px;flex-wrap:wrap;font-size:13.5px;font-weight:600;opacity:.92;margin-bottom:14px}
.meta-line span{background:rgba(0,0,0,.28);padding:5px 11px;border-radius:999px}
.detail-desc{max-width:560px;opacity:.92;font-size:14.5px;line-height:1.55;margin:0}

.date-pills{display:flex;gap:10px;overflow-x:auto;padding:22px 0 6px}
.date-pill{flex:0 0 auto;border:1px solid var(--line);background:var(--bg-1);border-radius:14px;padding:10px 16px;text-align:center;cursor:pointer;min-width:64px}
.date-pill .d{font-size:19px;font-weight:800}
.date-pill .m{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.date-pill.active{background:var(--accent);border-color:var(--accent)}
.date-pill.active .m{color:rgba(255,255,255,.85)}

.venue-block{margin:22px 0;border-top:1px solid var(--line-soft);padding-top:18px}
.venue-block h3{font-size:15px;margin:0 0 10px}
.venue-block .vsub{color:var(--muted-2);font-size:12.5px;margin-left:8px;font-weight:500}
.show-pills{display:flex;gap:10px;flex-wrap:wrap}
.show-pill{border:1px solid var(--line);background:var(--bg-1);color:var(--text);padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s}
.show-pill:hover{border-color:var(--gold);color:var(--gold)}
.show-pill .fmt{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}

/* ---------- seat map ---------- */
.flow-topbar{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line-soft);position:sticky;top:63px;background:var(--bg);z-index:20}
.flow-topbar .info b{display:block;font-size:15px}
.flow-topbar .info span{font-size:12.5px;color:var(--muted)}
.timer-pill{margin-left:auto;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.timer-pill.low{border-color:var(--accent);color:var(--accent)}
.timer-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
.timer-pill.low .timer-dot{background:var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.screen-wrap{max-width:640px;margin:34px auto 8px;text-align:center}
.screen-arc{width:100%;height:26px;border-radius:100% 100% 0 0/100% 100% 0 0;background:linear-gradient(180deg,rgba(255,190,61,.55),rgba(255,190,61,.05));box-shadow:0 14px 34px -12px rgba(255,190,61,.45)}
.screen-label{color:var(--muted-2);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:10px}

.seat-map{padding:22px 0 10px;overflow-x:auto}
.seat-row{display:flex;align-items:center;justify-content:center;gap:9px;margin:7px 0}
.row-tag{width:18px;font-size:11px;color:var(--muted-2);font-weight:700;text-align:center}
.seat-gap{width:16px}
.seat{width:30px;height:26px;border-radius:7px 7px 3px 3px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:9.5px;font-weight:700;cursor:pointer;transition:transform .12s ease, background .12s, border-color .12s;display:flex;align-items:center;justify-content:center}
.seat.recliner{width:36px;height:28px;border-radius:9px 9px 3px 3px}
.seat.premium{border-color:#3a3a48}
.seat:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold)}
.seat:disabled{cursor:not-allowed}
.seat.selected{background:var(--gold);border-color:var(--gold);color:#1a1200;transform:translateY(-3px) scale(1.05);box-shadow:0 6px 16px -4px rgba(255,190,61,.6)}
.seat.held{background:rgba(224,151,45,.18);border-color:var(--held);color:var(--held)}
.seat.booked{background:rgba(75,75,87,.35);border-color:var(--booked);color:var(--muted-2)}

.legend-row{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:26px 0 6px;font-size:12.5px;color:var(--muted)}
.legend-row .lg{display:flex;align-items:center;gap:7px}
.legend-row .sw{width:16px;height:14px;border-radius:4px;border:1.5px solid var(--line)}
.tier-price-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:6px 0 30px;font-size:12px;color:var(--muted-2)}
.tier-price-row b{color:var(--text)}

/* sticky checkout bar */
.checkout-bar{position:sticky;bottom:0;background:var(--bg-1);border-top:1px solid var(--line);padding:14px 0;margin-top:10px}
.checkout-bar .row{display:flex;align-items:center;gap:16px}
.checkout-bar .amount{font-size:19px;font-weight:800}
.checkout-bar .amount span{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.btn{border:0;border-radius:12px;padding:13px 22px;background:var(--accent);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;transition:filter .15s, transform .1s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:var(--bg-2);border:1px solid var(--line);color:var(--text)}
.btn.block{width:100%}
.btn.sm{padding:9px 16px;font-size:13px;border-radius:9px}

/* ---------- food step ---------- */
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:20px 0}
.food-card{background:var(--bg-1);border:1px solid var(--line-soft);border-radius:var(--radius);padding:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.food-card .fname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.veg-dot{width:11px;height:11px;border:1.5px solid var(--ok);border-radius:2px;display:inline-flex;align-items:center;justify-content:center}
.veg-dot::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok)}
.veg-dot.non::after{background:var(--accent)}
.veg-dot.non{border-color:var(--accent)}
.food-card .fprice{color:var(--muted);font-size:12.5px;margin-top:3px}
.qty-stepper{display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:5px 6px}
.qty-stepper button{width:24px;height:24px;border-radius:50%;border:0;background:var(--bg-3);color:var(--text);font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-stepper span{min-width:16px;text-align:center;font-weight:700;font-size:13px}

/* ---------- summary / payment ---------- */
.pay-layout{display:grid;grid-template-columns:1.3fr .9fr;gap:26px;margin-top:24px;align-items:start}
@media (max-width:820px){.pay-layout{grid-template-columns:1fr}}
.card{background:var(--bg-1);border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:22px}
.card h3{margin:0 0 14px;font-size:15.5px}
.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.method{border:1.5px solid var(--line);background:var(--bg-2);border-radius:11px;padding:14px 10px;text-align:center;font-size:12.5px;font-weight:700;cursor:pointer}
.method.active{border-color:var(--accent);color:var(--accent);background:rgba(255,77,94,.08)}
.coupon-row{display:flex;gap:8px;margin-top:6px}
.coupon-row input{flex:1;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--text);font:inherit;outline:none;text-transform:uppercase}
.coupon-row input:focus{border-color:var(--accent)}
.coupon-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.coupon-tag{font-size:11.5px;border:1px dashed var(--line);color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.coupon-applied{margin-top:10px;font-size:12.5px;color:var(--ok);display:flex;justify-content:space-between;align-items:center;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);padding:9px 12px;border-radius:9px}
.summary-line{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin:8px 0}
.summary-line.total{color:var(--text);font-weight:800;font-size:16px;border-top:1px solid var(--line-soft);padding-top:12px;margin-top:12px}
.summary-line.disc{color:var(--ok)}
.seat-tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.seat-tags span{background:var(--bg-2);border:1px solid var(--line);font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px}
.demo-toggle{margin-top:16px;font-size:12px;color:var(--muted-2);display:flex;align-items:center;gap:8px}

/* ---------- ticket ---------- */
.ticket{max-width:520px;margin:30px auto;background:var(--bg-1);border:1px solid var(--line-soft);border-radius:var(--radius-lg);overflow:hidden}
.ticket-top{padding:26px;color:#fff;position:relative}
.ticket-top .status{font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;opacity:.85}
.ticket-top h2{font-family:var(--font-display);font-size:30px;margin:6px 0 4px}
.ticket-top .sub{font-size:13px;opacity:.9}
.ticket-perf{position:relative;height:0}
.ticket-perf::before{content:"";position:absolute;left:0;right:0;top:-1px;border-top:2px dashed var(--line);}
.ticket-perf .hole{position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket-perf .hole.l{left:-11px}.ticket-perf .hole.r{right:-11px}
.ticket-body{padding:22px 26px 26px}
.tk-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.tk-grid .lbl{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.tk-grid .val{font-size:14px;font-weight:700}
.barcode{display:flex;align-items:flex-end;gap:2px;height:46px;justify-content:center;margin:16px 0 6px}
.barcode i{display:block;width:3px;background:var(--text);opacity:.85}
.ticket-id{text-align:center;font-size:12px;letter-spacing:3px;color:var(--muted);margin-bottom:6px}
.ticket-actions{display:flex;gap:10px;margin-top:18px}

/* ---------- my bookings ---------- */
.booking-card{background:var(--bg-1);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px;display:flex;gap:16px;margin-bottom:14px;align-items:center}
.booking-poster{width:56px;height:76px;border-radius:9px;flex:0 0 auto}
.booking-info{flex:1;min-width:0}
.booking-info h4{margin:0 0 4px;font-size:15px}
.booking-info .sub{color:var(--muted);font-size:12.5px}
.status-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px}
.status-badge.CONFIRMED{background:rgba(34,197,94,.15);color:var(--ok)}
.status-badge.CANCELLED{background:rgba(75,75,87,.3);color:var(--muted)}
.status-badge.PAYMENT_FAILED{background:rgba(255,77,94,.15);color:var(--accent)}
.booking-right{text-align:right;flex:0 0 auto}
.booking-right .amt{font-weight:800;font-size:15px;margin-bottom:8px}

/* ---------- toast / print ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);background:var(--bg-3);border:1px solid var(--line);padding:13px 20px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:100;transition:transform .28s cubic-bezier(.2,.8,.3,1);box-shadow:0 10px 30px -8px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0)}
.toast.err{border-color:var(--accent);color:#ffd7da}

footer.site{border-top:1px solid var(--line-soft);margin-top:50px;padding:26px 0;color:var(--muted-2);font-size:12.5px;text-align:center}

@media print{
  header.site,.flow-topbar,.ticket-actions,footer.site{display:none!important}
  body{background:#fff;color:#000}
  .ticket{border-color:#000}
}
@media (max-width:640px){
  .search-box{display:none}
  .site-bar{flex-wrap:wrap}
  .nav-links{margin-left:0}
}
</style>
</head>
<body>
<header class="site">
  <div class="wrap site-bar">
    <button class="brand" onclick="goHome()" title="Go to home">
      <span class="mark">🎬</span>
      <span class="name">Seat<b>Lock</b></span>
    </button>
    <div class="city-pick">
      📍 <select id="citySelect" onchange="onCityChange(this.value)"><option>Loading…</option></select>
    </div>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="Search movies…" oninput="onSearch(this.value)">
    </div>
    <div class="nav-links">
      <button id="navHome" class="active" onclick="goHome()">Now Showing</button>
      <button id="navBookings" onclick="goBookings()">My Bookings</button>
    </div>
    <div class="guest-pill" id="guestPill"></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="site">SeatLock — a concurrency-safe seat reservation demo. Payments are simulated; no real money moves.</footer>
<div class="toast" id="toast"></div>

<script>
/* ============================== state ============================== */
const userId = localStorage.getItem("seatlock-user") || (() => {
  const id = "guest-" + Math.random().toString(36).slice(2, 7);
  localStorage.setItem("seatlock-user", id);
  return id;
})();
document.getElementById("guestPill").textContent = "👤 " + userId;

const state = {
  city: localStorage.getItem("seatlock-city") || "",
  search: "",
  movies: [],
  cities: [],
  currentMovie: null,
  selectedDate: null,
  currentShow: null,
  seats: [],
  selected: new Set(),
  holdExpiresAt: null,
  timer: null,
  foods: [],
  cart: new Map(),      // foodId -> qty
  coupon: null,         // {code, discount, description}
  paymentMethod: "CARD",
  simulateFailure: false,
  lastBooking: null
};

/* ============================== helpers ============================== */
async function api(url, opts) {
  const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
  const json = await res.json();
  if (!res.ok || json.success === false) throw json;
  return json;
}
function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2800);
}
function money(n) { return "₹" + Number(n).toLocaleString("en-IN"); }
function setActiveNav(id) {
  document.querySelectorAll(".nav-links button").forEach(b => b.classList.remove("active"));
  const el = document.getElementById(id);
  if (el) el.classList.add("active");
}
function gradientCss(g) { return `linear-gradient(${g})`; }
function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return { day: d.getDate(), mon: d.toLocaleString("en-US", { month: "short" }), wk: d.toLocaleString("en-US", { weekday: "short" }) };
}
function fmtTime12(t) {
  const [h, m] = t.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  const hh = ((h + 11) % 12) + 1;
  return `${hh}:${String(m).padStart(2, "0")} ${ap}`;
}
function clearHoldTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }

/* ============================== boot ============================== */
async function boot() {
  try {
    const [cities, movies] = await Promise.all([api("/api/cities"), api("/api/movies")]);
    state.cities = cities.data;
    if (!state.city || !state.cities.includes(state.city)) state.city = state.cities[0] || "";
    const sel = document.getElementById("citySelect");
    sel.innerHTML = state.cities.map(c => `<option value="${c}" ${c === state.city ? "selected" : ""}>${c}</option>`).join("");
    await goHome();
  } catch (e) {
    document.getElementById("app").innerHTML = `<div class="empty-state"><div class="big">⚠️</div>Couldn't reach the server. Is it running?</div>`;
  }
}
function onCityChange(city) {
  state.city = city;
  localStorage.setItem("seatlock-city", city);
  goHome();
}
let searchDebounce;
function onSearch(v) {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { state.search = v; renderHome(); }, 250);
}

/* ============================== HOME ============================== */
async function goHome() {
  clearHoldTimer();
  setActiveNav("navHome");
  const app = document.getElementById("app");

    <div class="view">
      <section class="hero">

function renderHome() {

/* ============================== MOVIE DETAIL ============================== */

function renderMovieDetail() {

function selectDate(d) { state.selectedDate = d; renderMovieDetail(); }

/* ============================== SEAT MAP ============================== */
async function selectShow(showId) {
  const show = state.currentMovie.shows.find(s => s.id === showId);

}
async function loadSeatsAndRender() {

function seatDisplayClass(s) {
  if (state.selected.has(s.id)) return "selected";
  return s.status.toLowerCase(); // available | held | booked
}
function tierLabel(t) { return t === "RECLINER" ? "Recliner" : t === "PREMIUM" ? "Premium" : "Regular"; }
function renderSeatMap() {
  setActiveNav("");
  const sh = state.currentShow;
  const rows = {};
  state.seats.forEach(s => (rows[s.row_name] ??= []).push(s));
  const tiers = [...new Map(state.seats.map(s => [s.seat_type, s.price])).entries()];

          <div class="seat-row">
            <span class="row-tag">${row}</span>
            ${seats.slice(0, 5).map(seatBtn).join("")}
            <span class="seat-gap"></span>

            <span class="row-tag">${row}</span>
          </div>`).join("")}
      </div>

      <div class="legend-row">
        <div class="lg"><span class="sw" style="background:transparent"></span>Available</div>
        <div class="lg"><span class="sw" style="background:var(--gold);border-color:var(--gold)"></span>Selected</div>
        <div class="lg"><span class="sw" style="background:rgba(224,151,45,.3);border-color:var(--held)"></span>Reserved</div>

        ${tiers.map(([t, p]) => `<span>${tierLabel(t)} — <b>${money(p)}</b></span>`).join("")}

function seatBtn(s) {
  const cls = seatDisplayClass(s);
  const disabled = s.status !== "AVAILABLE" && !state.selected.has(s.id);
  const tierCls = s.seat_type === "RECLINER" ? "recliner" : s.seat_type === "PREMIUM" ? "premium" : "";
  return `<button class="seat ${tierCls} ${cls}" ${disabled ? "disabled" : ""} onclick="toggleSeat('${s.id}')" title="${s.id} · ${tierLabel(s.seat_type)} · ${money(s.price)}">${s.seat_number}</button>`;
}
function toggleSeat(id) {
  if (state.holdExpiresAt) return; // locked in once reserved
  if (state.selected.has(id)) state.selected.delete(id);
  else {
    if (state.selected.size >= 10) return toast("You can select up to 10 seats");
    state.selected.add(id);
  }
  renderSeatMap();
}
async function confirmHold() {
  if (state.holdExpiresAt) return goToFood();
  try {
    const res = await api(`/api/shows/${state.currentShow.id}/hold-seats`, {
      method: "POST", body: JSON.stringify({ userId, seatIds: [...state.selected] })
    });
    state.holdExpiresAt = res.data.expiresAt;
    toast("Seats reserved for 10 minutes");
    renderSeatMap();
  } catch (e) {
    toast(e.message || "Couldn't reserve those seats", true);
    await loadSeatsAndRender();
  }
}
function startHoldTimer() {
  clearHoldTimer();
  const tick = () => {
    const slot = document.getElementById("timerSlot");
    if (!slot) return clearHoldTimer();
    const ms = new Date(state.holdExpiresAt) - Date.now();
    const sec = Math.max(0, Math.floor(ms / 1000));
    const low = sec <= 90;
    slot.innerHTML = `<div class="timer-pill ${low ? "low" : ""}"><span class="timer-dot"></span>${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")} left</div>`;
    if (sec <= 0) {
      clearHoldTimer();
      toast("Your reservation expired", true);
      state.holdExpiresAt = null; state.selected = new Set();
      loadSeatsAndRender();
    }
  };
  tick();
  state.timer = setInterval(tick, 1000);
}

/* ============================== FOOD & BEVERAGES ============================== */
async function goToFood() {
  if (!state.foods.length) {
    try { state.foods = (await api("/api/foods")).data; } catch (e) { state.foods = []; }
  }
  renderFood();
}
function renderFood() {
  const grouped = {};
  state.foods.forEach(f => (grouped[f.category] ??= []).push(f));
  const foodTotal = [...state.cart.entries()].reduce((sum, [id, qty]) => sum + qty * (state.foods.find(f => f.id === id)?.price || 0), 0);
  const seatTotal = [...state.selected].reduce((sum, id) => sum + (state.seats.find(s => s.id === id)?.price || 0), 0);

  document.getElementById("app").innerHTML = `
    <div class="view">

        <button class="back-btn" style="background:var(--bg-2);border-color:var(--line);color:var(--text)" onclick="renderSeatMap()">← Seats</button>
        <div class="info"><b>Snacks & drinks</b><span>Optional — skip if you're just here for the movie</span></div>
        <div id="timerSlot"></div>
      </div>

      ${Object.entries(grouped).map(([cat, items]) => `
        <div class="section-head" style="margin:26px 0 10px"><h2 style="font-size:19px">${cat}</h2></div>
        <div class="food-grid">
          ${items.map(f => `
            <div class="food-card">
              <div>
                <div class="fname"><span class="veg-dot ${f.veg ? "" : "non"}"></span>${f.name}</div>
                <div class="fprice">${money(f.price)}</div>
              </div>
              <div class="qty-stepper">
                <button onclick="changeQty('${f.id}',-1)">−</button>
                <span id="qty-${f.id}">${state.cart.get(f.id) || 0}</span>
                <button onclick="changeQty('${f.id}',1)">+</button>
              </div>
            </div>`).join("")}
        </div>`).join("")}

      <div class="checkout-bar">
        <div class="wrap row" style="padding:0">
          <div class="amount">${money(seatTotal + foodTotal)}<span>Seats ${money(seatTotal)} + food ${money(foodTotal)}</span></div>
          <button class="btn" style="margin-left:auto" onclick="goToPayment()">Continue to payment</button>
        </div>
      </div>
    </div>`;
  if (state.holdExpiresAt) startHoldTimer();
}
function changeQty(id, delta) {
  const cur = state.cart.get(id) || 0;
  const next = Math.max(0, Math.min(9, cur + delta));
  if (next === 0) state.cart.delete(id); else state.cart.set(id, next);
  document.getElementById("qty-" + id).textContent = next;
  renderFood();
}

/* ============================== PAYMENT ============================== */
const CONVENIENCE_FEE = 60;
function goToPayment() { state.coupon = null; renderPayment(); }
function renderPayment() {
  const seatTotal = [...state.selected].reduce((sum, id) => sum + (state.seats.find(s => s.id === id)?.price || 0), 0);
  const foodTotal = [...state.cart.entries()].reduce((sum, [id, qty]) => sum + qty * (state.foods.find(f => f.id === id)?.price || 0), 0);
  const preDiscount = seatTotal + foodTotal + CONVENIENCE_FEE;

  const sh = state.currentShow;

  document.getElementById("app").innerHTML = `
    <div class="view">
      <div class="flow-topbar">
        <button class="back-btn" style="background:var(--bg-2);border-color:var(--line);color:var(--text)" onclick="renderFood()">← Snacks</button>

          <div class="card">

            </div>

              <input type="checkbox" id="simFail" ${state.simulateFailure ? "checked" : ""} onchange="state.simulateFailure=this.checked">
              <label for="simFail">Simulate a failed payment (to test the failure flow)</label>
            </div>
          </div>

          <div class="card" style="margin-top:18px">
            <h3>Have a coupon?</h3>
            <div class="coupon-row">
              <input id="couponInput" placeholder="ENTER CODE" maxlength="20">
              <button class="btn ghost sm" onclick="applyCoupon()">Apply</button>
            </div>
            <div class="coupon-list">
              <span class="coupon-tag" onclick="fillCoupon('FIRST50')">FIRST50</span>
              <span class="coupon-tag" onclick="fillCoupon('SEAT20')">SEAT20</span>
              <span class="coupon-tag" onclick="fillCoupon('WEEKEND10')">WEEKEND10</span>
            </div>
            <div id="couponMsg">${state.coupon ? `<div class="coupon-applied"><span>🎟️ ${state.coupon.code} applied — you saved ${money(state.coupon.discount)}</span><span style="cursor:pointer" onclick="removeCoupon()">✕</span></div>` : ""}</div>
          </div>
        </div>

        <div class="card">
          <h3>Order summary</h3>
          <div class="seat-tags">${[...state.selected].map(id => `<span>${id}</span>`).join("")}</div>
          <div class="summary-line"><span>Seats (${state.selected.size})</span><span>${money(seatTotal)}</span></div>
          ${foodTotal ? `<div class="summary-line"><span>Food & beverages</span><span>${money(foodTotal)}</span></div>` : ""}
          <div class="summary-line"><span>Convenience fee</span><span>${money(CONVENIENCE_FEE)}</span></div>
          ${discount ? `<div class="summary-line disc"><span>Coupon discount</span><span>−${money(discount)}</span></div>` : ""}
          <div class="summary-line total"><span>Total</span><span>${money(total)}</span></div>
          <button class="btn block" style="margin-top:16px" onclick="pay()">Pay ${money(total)}</button>
        </div>
      </div>
    </div>`;
  if (state.holdExpiresAt) startHoldTimer();
}
function setMethod(m) { state.paymentMethod = m; renderPayment(); }
function fillCoupon(code) { document.getElementById("couponInput").value = code; applyCoupon(); }
async function applyCoupon() {
  const code = document.getElementById("couponInput").value.trim();
  if (!code) return;
  const seatTotal = [...state.selected].reduce((sum, id) => sum + (state.seats.find(s => s.id === id)?.price || 0), 0);
  const foodTotal = [...state.cart.entries()].reduce((sum, [id, qty]) => sum + qty * (state.foods.find(f => f.id === id)?.price || 0), 0);
  const amount = seatTotal + foodTotal + CONVENIENCE_FEE;
  try {
    const res = await api("/api/coupons/apply", { method: "POST", body: JSON.stringify({ code, amount }) });
    state.coupon = res.data;
    toast("Coupon applied!");
    renderPayment();
  } catch (e) {
    toast(e.message || "Invalid coupon", true);
  }
}
function removeCoupon() { state.coupon = null; renderPayment(); }

async function pay() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = "Processing…";
  try {
    const foodItems = [...state.cart.entries()].map(([id, qty]) => ({ id, qty }));
    const res = await api("/api/payments/mock", {
      method: "POST",
      body: JSON.stringify({
        showId: state.currentShow.id, userId, seatIds: [...state.selected],
        foodItems, couponCode: state.coupon?.code, discount: state.coupon?.discount || 0,
        paymentMethod: state.paymentMethod,
        paymentResult: state.simulateFailure ? "FAILED" : "SUCCESS",
        idempotencyKey: crypto.randomUUID()
      })
    });
    clearHoldTimer();
    state.lastBooking = { ...res.data, show: state.currentShow, seats: [...state.selected], foodItems, movie: state.currentMovie };
    state.holdExpiresAt = null;
    if (res.data.bookingStatus === "CONFIRMED") renderTicket(state.lastBooking, true);
    else {
      toast("Payment failed — your seats were released", true);
      state.selected = new Set(); state.cart = new Map(); state.coupon = null;
      await loadSeatsAndRender();
    }
  } catch (e) {
    toast(e.message || "Payment could not be processed", true);
    btn.disabled = false; btn.textContent = "Pay again";
  }
}

/* ============================== TICKET ============================== */
function barcodeBars(seed) {
  let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  let bars = "";
  for (let i = 0; i < 46; i++) { h = (h * 1103515245 + 12345) >>> 0; bars += `<i style="height:${14 + (h % 32)}px"></i>`; }
  return bars;
}

          <div class="barcode">${barcodeBars(b.bookingId)}</div>

/* ============================== MY BOOKINGS ============================== */
async function goBookings() {
  clearHoldTimer();
  setActiveNav("navBookings");
  const app = document.getElementById("app");
  app.innerHTML = `<div class="view"><div class="section-head"><h2>My Bookings</h2></div><div class="empty-state">Loading…</div></div>`;
  try {
    const res = await api(`/api/bookings?userId=${encodeURIComponent(userId)}`);
    renderBookings(res.data);
  } catch (e) {
    app.innerHTML = `<div class="empty-state">Couldn't load your bookings.</div>`;
  }
}
function renderBookings(list) {
  const app = document.getElementById("app");
  if (!list.length) {
    app.innerHTML = `<div class="view"><div class="section-head"><h2>My Bookings</h2></div><div class="empty-state"><div class="big">🎟️</div>No bookings yet — go find something to watch.</div></div>`;
    return;
  }
  app.innerHTML = `
    <div class="view">
      <div class="section-head"><h2>My Bookings</h2><span>${list.length} total</span></div>
      ${list.map(b => {
        const showDT = new Date(`${b.show_date}T${b.show_time}:00`);
        const upcoming = showDT.getTime() > Date.now();
        const cancellable = b.status === "CONFIRMED" && upcoming && (showDT - Date.now()) / 36e5 >= 2;
        return `
        <div class="booking-card">
          <div class="booking-poster" style="background:linear-gradient(160deg,#7c3aed,#db2777)"></div>
          <div class="booking-info">
            <h4>${b.title}</h4>
            <div class="sub">${b.venue} · ${b.city} · ${b.show_date} · ${fmtTime12(b.show_time)} · ${b.format}</div>
            <div class="sub">Seats: ${b.seats.join(", ")}</div>
          </div>
          <div class="booking-right">
            <div class="amt">${money(b.amount)}</div>
            <span class="status-badge ${b.status}">${b.status.replace("_", " ")}</span><br>
            ${b.status === "CONFIRMED" ? `<button class="btn ghost sm" style="margin-top:8px" onclick='viewTicketAgain(${JSON.stringify(b)})'>View ticket</button>` : ""}
            ${cancellable ? `<button class="btn sm" style="margin-top:8px;background:var(--bg-3);color:var(--accent)" onclick="cancelBooking('${b.id}')">Cancel</button>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`;
}
function viewTicketAgain(b) {
  renderTicket({
    bookingId: b.id, amount: b.amount, bookingStatus: b.status,
    show: { title: b.title, venue: b.venue, city: b.city, show_date: b.show_date, show_time: b.show_time, format: b.format },
    seats: b.seats, foodItems: b.foodItems, movie: null
  }, false);
}
async function cancelBooking(id) {
  if (!confirm("Cancel this booking? A partial refund may apply depending on how close it is to showtime.")) return;
  try {
    const res = await api(`/api/bookings/${id}/cancel`, { method: "POST" });
    toast(`Cancelled — ${res.data.refundPercent}% refund (${money(res.data.refundAmount)})`);
    goBookings();
  } catch (e) {
    toast(e.message || "Couldn't cancel this booking", true);
  }
}

boot();
</script>
</body>
</html>
